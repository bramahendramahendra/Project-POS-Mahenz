# Routing versi lama/baru untuk side-by-side testing (Mode B di docs/DEPLOYMENT_REDEPLOY_FULL.md).
# Tidak berpengaruh ke deploy normal — tanpa cookie ver_bypass, kedua map ini selalu jatuh ke
# "default" (versi berjalan seperti biasa: port 8080, folder dist/). Nama folder/port "old" DIBUAT
# TETAP (dist_old, 8081) supaya file config ini tidak perlu diedit ulang setiap redeploy —
# saat menjalankan Mode B, arahkan/rename arsip FE lama ke /var/www/pos-web/dist_old dan BE lama ke
# port 8081, bukan folder bertanggal, biar cocok dengan mapping di sini.
map $cookie_ver_bypass $backend_port {
    default 8080;
    old     8081;
}
map $cookie_ver_bypass $spa_root {
    default /var/www/pos-web/dist;
    old     /var/www/pos-web/dist_old;
}

server {
    listen 80;
    server_name _;
    root /var/www/pos-web/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Token bypass maintenance — di-generate & di-rotasi otomatis oleh maintenance-on.sh / maintenance-off.sh
    set $maintenance_token "";
    include /etc/nginx/maintenance_token.conf;

    set $maintenance 0;
    if (-f /var/www/pos-web/maintenance.flag) {
        set $maintenance 1;
    }

    # Cek cookie bypass: hanya valid kalau token pernah di-set (tidak kosong) DAN cocok dengan token aktif saat ini
    set $bypass_ok 0;
    if ($maintenance_token != "") {
        set $bypass_ok 1;
    }
    if ($cookie_mnt_bypass != $maintenance_token) {
        set $bypass_ok 0;
    }
    if ($bypass_ok = 1) {
        set $maintenance 0;
    }

    if ($request_uri ~* ^/maintenance\.html$) {
        set $maintenance 0;
    }

    error_page 503 /maintenance.html;

    location = /maintenance.html {
        root /var/www/pos-web/maintenance;
        internal;
    }

    # Buka sekali: https://domain-anda/maintenance-bypass?token=TOKEN_AKTIF
    # Set cookie mnt_bypass (24 jam) supaya request berikutnya lolos dari blok maintenance tanpa perlu token lagi di URL.
    # Tambahkan &version=old di URL (hanya relevan saat Mode B aktif) untuk sekaligus memilih versi lama via cookie ver_bypass.
    location = /maintenance-bypass {
        if ($maintenance_token = "") {
            return 403;
        }
        if ($arg_token != $maintenance_token) {
            return 403;
        }
        add_header Set-Cookie "mnt_bypass=$maintenance_token; Path=/; Max-Age=86400; HttpOnly; SameSite=Lax" always;
        add_header Set-Cookie "ver_bypass=$arg_version; Path=/; Max-Age=86400; HttpOnly; SameSite=Lax" always;
        return 302 /;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        if ($maintenance = 1) {
            return 503;
        }
        root $spa_root;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        if ($maintenance = 1) {
            return 503;
        }
        root $spa_root;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        if ($maintenance = 1) {
            return 503;
        }
        proxy_pass http://127.0.0.1:$backend_port;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
