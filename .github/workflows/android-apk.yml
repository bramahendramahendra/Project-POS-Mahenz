name: Build Android APK

# Build APK pembungkus (Capacitor, folder mobile/) di cloud — tidak perlu Android
# Studio di laptop. Hasil APK diunggah sebagai artifact untuk diunduh & di-sideload.
#
# Pemicu:
#  - Manual (workflow_dispatch) dari tab Actions.
#  - Push ke main yang menyentuh folder mobile/ atau workflow ini.
#
# Signing:
#  - Bila 4 secret keystore tersedia (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD,
#    ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) → build APK RELEASE bertanda tangan.
#  - Bila tidak → build APK DEBUG (tetap bisa di-install untuk uji).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Generate Android project (Capacitor)
        run: |
          npx cap add android || npx cap sync android
          npx cap sync android

      - name: Decode keystore (jika ada secret)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build RELEASE APK (signed)
        if: steps.keystore.outputs.has_keystore == 'true'
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=app/release.keystore \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Build DEBUG APK (fallback tanpa keystore)
        if: steps.keystore.outputs.has_keystore == 'false'
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pos-mahenz-apk
          path: |
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
