# Konfigurasi nginx — Mahenz Portal + POS Toko (+ POS Coffee nanti). Sumber tunggal di repo.
#
# Pembagian alamat (satu domain, berbasis path):
#   /                 FE Portal            /var/www/pos-web/portal
#   /portal-api/      BE Portal            127.0.0.1:8080  (diteruskan ke /api/ di BE)
#   /toko/            FE Toko              /var/www/pos-web/apps/toko
#   /toko/api/        BE Toko              127.0.0.1:8081  (diteruskan ke /api/ di BE)
#   /api/             BE Toko (LAMA)       127.0.0.1:8081  (jalur peralihan: FE/APK lama yang masih ter-cache)
#   (Coffee nanti: /coffee/ -> /var/www/pos-web/apps/coffee, /coffee/api/ -> 127.0.0.1:8082)
#
# HTTPS dikelola certbot di server. Setelah file ini dipasang jalankan:
#   sudo certbot --nginx
# agar blok 443 dan redirect ditambahkan kembali (sertifikat lama dipakai ulang).
#
# Maintenance mode:
#   - semua aplikasi : /var/www/pos-web/maintenance.flag
#   - per aplikasi   : /var/www/pos-web/maintenance-portal.flag | maintenance-toko.flag
#   Kelola dengan nginx/maintenance/maintenance-on.sh dan maintenance-off.sh.
#   Cookie bypass (mnt_bypass) berlaku untuk semua aplikasi.

server {
    listen 80;
    server_name mahenz.duckdns.org;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Token bypass maintenance — di-generate & di-rotasi otomatis oleh maintenance-on.sh / maintenance-off.sh
    set $maintenance_token "";
    include /etc/nginx/maintenance_token.conf;

    # Maintenance untuk SEMUA aplikasi
    set $maintenance 0;
    if (-f /var/www/pos-web/maintenance.flag) {
        set $maintenance 1;
    }

    # Cek cookie bypass
    set $bypass_ok 0;
    if ($maintenance_token != "") {
        set $bypass_ok 1;
    }
    if ($cookie_mnt_bypass != $maintenance_token) {
        set $bypass_ok 0;
    }
    if ($bypass_ok = 1) {
        set $maintenance 0;
    }

    if ($request_uri ~* ^/maintenance\.html$) {
        set $maintenance 0;
    }

    error_page 503 /maintenance.html;

    location = /maintenance.html {
        root /var/www/pos-web/maintenance;
        internal;
    }

    # Buka sekali: https://mahenz.duckdns.org/maintenance-bypass?token=TOKEN_AKTIF
    location = /maintenance-bypass {
        if ($maintenance_token = "") {
            return 403;
        }
        if ($arg_token != $maintenance_token) {
            return 403;
        }
        add_header Set-Cookie "mnt_bypass=$maintenance_token; Path=/; Max-Age=86400; HttpOnly; SameSite=Lax" always;
        return 302 /;
    }

    # ------------------------------------------------------------------
    # Portal — API
    # ------------------------------------------------------------------
    location ^~ /portal-api/ {
        set $mt $maintenance;
        if (-f /var/www/pos-web/maintenance-portal.flag) { set $mt 1; }
        if ($bypass_ok = 1) { set $mt 0; }
        if ($mt = 1) { return 503; }

        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # Toko — API (alamat baru dan alamat lama)
    # ------------------------------------------------------------------
    location ^~ /toko/api/ {
        set $mt $maintenance;
        if (-f /var/www/pos-web/maintenance-toko.flag) { set $mt 1; }
        if ($bypass_ok = 1) { set $mt 0; }
        if ($mt = 1) { return 503; }

        proxy_pass http://127.0.0.1:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Jalur lama /api -> BE Toko, agar FE/APK lama yang masih ter-cache tidak langsung putus.
    # Hapus blok ini setelah semua perangkat memakai alamat baru.
    location ^~ /api/ {
        set $mt $maintenance;
        if (-f /var/www/pos-web/maintenance-toko.flag) { set $mt 1; }
        if ($bypass_ok = 1) { set $mt 0; }
        if ($mt = 1) { return 503; }

        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # Toko — FE (di-build dengan VITE_BASE_PATH=/toko/)
    # ------------------------------------------------------------------
    location = /toko {
        return 301 /toko/;
    }

    location ^~ /toko/assets/ {
        set $mt $maintenance;
        if (-f /var/www/pos-web/maintenance-toko.flag) { set $mt 1; }
        if ($bypass_ok = 1) { set $mt 0; }
        if ($mt = 1) { return 503; }

        root /var/www/pos-web/apps;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /toko/ {
        set $mt $maintenance;
        if (-f /var/www/pos-web/maintenance-toko.flag) { set $mt 1; }
        if ($bypass_ok = 1) { set $mt 0; }
        if ($mt = 1) { return 503; }

        root /var/www/pos-web/apps;
        try_files $uri $uri/ /toko/index.html;
        add_header Cache-Control "no-cache";
    }

    # ------------------------------------------------------------------
    # Portal — FE (di root domain)
    # ------------------------------------------------------------------
    location ^~ /assets/ {
        set $mt $maintenance;
        if (-f /var/www/pos-web/maintenance-portal.flag) { set $mt 1; }
        if ($bypass_ok = 1) { set $mt 0; }
        if ($mt = 1) { return 503; }

        root /var/www/pos-web/portal;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        set $mt $maintenance;
        if (-f /var/www/pos-web/maintenance-portal.flag) { set $mt 1; }
        if ($bypass_ok = 1) { set $mt 0; }
        if ($mt = 1) { return 503; }

        root /var/www/pos-web/portal;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
